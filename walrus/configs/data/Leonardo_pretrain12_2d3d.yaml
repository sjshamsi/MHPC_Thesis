defaults:
  - field_index_map_override: bc_only_override
  - transform: random_rotation90_train
well_base_path: /leonardo_work/ICT26_MHPC_0/sshamsi/datasets/ # Usually overrided by server
wandb_data_name: "well_pretrain12_2d3d"
# Pretraining mixture for SCALING_STRATEGY_2D3D.md: 9 2D + 3 3D Well datasets. Six are held out
# for blind downstream finetuning and must never be added here: active_matter,
# helmholtz_staircase, turbulent_radiative_layer_2D, viscoelastic_instability (2D), MHD_64 and
# rayleigh_taylor_instability (3D). Run with model.override_dimensionality=0 so 2D and 3D data
# use separate encoder/decoder stems, as in upstream pretraining. The 3D entries copy upstream
# all_2_3d.yaml: half the time history and half the batch, so 2D and 3D micro-batches carry
# roughly equal tokens.
module_parameters:
  _target_: walrus.data.MixedWellDataModule
  batch_size: 8
  n_steps_input: 10
  n_steps_output: 1
  min_dt_stride: 1
  max_dt_stride: 1
  max_samples: 2000 # Time in fake epochs
  well_dataset_info:
    acoustic_scattering_discontinuous:
      include_filters: []
      exclude_filters: []
      field_transforms:
        density: torch.zeros_like
    acoustic_scattering_inclusions:
      include_filters: []
      exclude_filters: []
      field_transforms:
        density: torch.zeros_like
    acoustic_scattering_maze:
      include_filters: []
      exclude_filters: []
      field_transforms:
        density: torch.zeros_like
    euler_multi_quadrants_openBC:
      include_filters: []
      exclude_filters: []
    euler_multi_quadrants_periodicBC:
      include_filters: []
      exclude_filters: []
    gray_scott_reaction_diffusion:
      include_filters: []
      exclude_filters: []
    planetswe:
      include_filters: []
      exclude_filters: []
    rayleigh_benard:
      include_filters: []
      exclude_filters: []
    shear_flow:
      include_filters: []
      exclude_filters: []
    supernova_explosion_128:
      include_filters: []
      exclude_filters: []
      step_downsample_factor: .5
      batch_downsample_factor: .5
      field_transforms:
        density: torch.log10
        temperature: torch.log10
    turbulence_gravity_cooling:
      include_filters: []
      exclude_filters: []
      step_downsample_factor: .5
      batch_downsample_factor: .5
      field_transforms:
        density: torch.log10
        temperature: torch.log10
    turbulent_radiative_layer_3D:
      include_filters: []
      exclude_filters: []
      step_downsample_factor: .5
      batch_downsample_factor: .5
      field_transforms:
        density: torch.log10
        temperature: torch.log10
