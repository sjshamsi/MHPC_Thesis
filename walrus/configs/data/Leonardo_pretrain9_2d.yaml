defaults:
  - field_index_map_override: bc_only_override
  - transform: random_rotation90_train
well_base_path: /leonardo_work/ICT26_MHPC_0/sshamsi/datasets/ # Usually overrided by server
wandb_data_name: "well_pretrain9_2d"
# Pretraining mixture for SCALING_STRATEGY_2D.md: the 13 on-disk 2D Well datasets minus the four
# held out for blind downstream finetuning (active_matter, helmholtz_staircase,
# turbulent_radiative_layer_2D, viscoelastic_instability). Do not add those four here.
module_parameters:
  _target_: walrus.data.MixedWellDataModule
  batch_size: 8
  n_steps_input: 10
  n_steps_output: 1
  min_dt_stride: 1
  max_dt_stride: 1
  max_samples: 2000 # Time in fake epochs
  well_dataset_info:
    acoustic_scattering_discontinuous:
      include_filters: []
      exclude_filters: []
      field_transforms:
        density: torch.zeros_like
    acoustic_scattering_inclusions:
      include_filters: []
      exclude_filters: []
      field_transforms:
        density: torch.zeros_like
    acoustic_scattering_maze:
      include_filters: []
      exclude_filters: []
      field_transforms:
        density: torch.zeros_like
    euler_multi_quadrants_openBC:
      include_filters: []
      exclude_filters: []
    euler_multi_quadrants_periodicBC:
      include_filters: []
      exclude_filters: []
    gray_scott_reaction_diffusion:
      include_filters: []
      exclude_filters: []
    planetswe:
      include_filters: []
      exclude_filters: []
    rayleigh_benard:
      include_filters: []
      exclude_filters: []
    shear_flow:
      include_filters: []
      exclude_filters: []
