hydra:
  run:
    dir: /leonardo_work/ICT26_MHPC_0/sshamsi/logs/test_resume_wandb/hydra/62382038_phase3
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/leonardo_work/ICT26_MHPC_0/sshamsi/logs/test_resume_wandb/hydra/62382038_phase3
    - hydra.mode=RUN
    task:
    - distribution=ddp
    - server=leonardo
    - data=debug
    - model=debug
    - trainer=debug
    - ++experiment_dir=/leonardo_work/ICT26_MHPC_0/sshamsi/logs
    - name=test_resume_wandb
    - logger.wandb_project_name=walrus_leonardo_test
    - data_workers=2
    - ++trainer.debug_mode=True
    - trainer.short_validation_length=2
    - trainer.max_rollout_steps=4
    - ++trainer.skip_spectral_metrics=True
    - auto_resume=True
    - trainer.max_epoch=3
  job:
    name: train
    chdir: null
    override_dirname: ++experiment_dir=/leonardo_work/ICT26_MHPC_0/sshamsi/logs,++trainer.debug_mode=True,++trainer.skip_spectral_metrics=True,auto_resume=True,data=debug,data_workers=2,distribution=ddp,logger.wandb_project_name=walrus_leonardo_test,model=debug,name=test_resume_wandb,server=leonardo,trainer.max_epoch=3,trainer.max_rollout_steps=4,trainer.short_validation_length=2,trainer=debug
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.8
    version_base: '1.3'
    cwd: /leonardo/home/userexternal/sshamsi0/Public_Thesis/walrus
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /leonardo/home/userexternal/sshamsi0/Public_Thesis/walrus/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /leonardo_work/ICT26_MHPC_0/sshamsi/logs/test_resume_wandb/hydra/62382038_phase3
    choices:
      finetuning_mods: defaults
      checkpoint: defaults
      logger: wandb
      distribution: ddp
      server: leonardo
      experiment: defaults
      data: debug
      model: debug
      model/norm_layer: rmsgroupnorm
      model/processor: space_time_split
      model/processor/channel_mixing: identity
      model/processor/time_mixing: axial_time_attention
      model/processor/space_mixing: axial_spatial_attention
      model/decoder: vstride_decoder
      model/encoder: spacebag_and_vstride_encoder
      lr_scheduler: inv_sqrt_w_linear_ramps
      optimizer: adam
      trainer: debug
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
